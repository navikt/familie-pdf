application:
  name: "familie-pdf"
server:
  servlet:
    context-path: /

spring:
  main:
    allow-bean-definition-overriding: true
    banner-mode: "off"
logging:
  config: "classpath:logback-spring.xml"

springdoc:
  packagesToScan: no.nav.familie.pdf
  pathsToMatch: /v3/api-docs,/api/**
  swagger-ui:
    disable-swagger-default-url: true

management:
  endpoint.info.access: none
  endpoint.health:
    show-details: always
    probes.enabled: true
  info:
    defaults:
      enabled: false
  endpoints.web:
    exposure.include: health, metrics, prometheus
    base-path: "/internal"
  prometheus.metrics.export.enabled: true
  health:
    db:
      enabled: true

unleash:
  enabled: true